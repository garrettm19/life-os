name: CI

on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check Expo dependency compatibility
        run: npm run deps:check

      - name: Formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:ci

      # Local-date logic has failed east of UTC+10 before; the default runner zone is UTC.
      - name: Test in a far-east time zone
        run: npm run test:ci
        env:
          TZ: Pacific/Kiritimati

      # Runs the daylight-saving tests, which only apply in a zone that changes its clocks.
      - name: Test in a daylight-saving time zone
        run: npm run test:ci
        env:
          TZ: America/New_York

      - name: Expo Doctor
        run: npm run doctor

      - name: Export iOS bundle
        run: npm run export:ios

      - name: Export browser app
        run: npm run export:web

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:web

      # Traces and screenshots from synthetic test data only.
      - name: Keep browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
