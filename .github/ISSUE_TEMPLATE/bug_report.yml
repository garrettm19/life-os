name: Bug report
description: Something in the app does not work as expected.
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: >-
        Never paste real routines, health, money, trading or journal details, backups, setup files or
        screenshots that show them. Describe the problem with made-up examples.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open Today\n2. Tap ...\n3. See ..."
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: Build
      description: App version or EAS build ID, iOS version and device, or "browser preview".
    validations:
      required: true
  - type: dropdown
    id: data
    attributes:
      label: Did any saved data change or disappear?
      options:
        - 'No'
        - 'Yes'
        - Not sure
    validations:
      required: true
